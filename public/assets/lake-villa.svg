<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ddd3ca"/><stop offset=".48" stop-color="#eee1d8"/><stop offset="1" stop-color="#f1e6da"/></linearGradient>
    <linearGradient id="stone" x1="0" x2="1"><stop stop-color="#8c765e"/><stop offset=".5" stop-color="#e4d4ba"/><stop offset="1" stop-color="#947a5b"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#abb69d"/><stop offset="1" stop-color="#72846f"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff7df" stop-opacity=".9"/><stop offset="1" stop-color="#f0c976" stop-opacity=".04"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="900" height="1400" fill="url(#sky)"/>
  <circle cx="190" cy="210" r="95" fill="#fff9ec" opacity=".22" filter="url(#glow)"/>
  <circle cx="700" cy="250" r="120" fill="#fff9ec" opacity=".2" filter="url(#glow)"/>

  <!-- distant trees / garden -->
  <g opacity=".5" fill="#83907a">
    <circle cx="60" cy="610" r="70"/><circle cx="150" cy="570" r="92"/><circle cx="780" cy="580" r="100"/><circle cx="865" cy="630" r="75"/>
  </g>

  <!-- BAPS-inspired carved temple silhouette -->
  <g transform="translate(118 220)">
    <path d="M30 520V330L170 235L260 290L350 235L490 330V520Z" fill="#d1c0a4"/>
    <path d="M74 306L170 235L260 290L350 235L446 306" fill="none" stroke="#8c7457" stroke-width="9"/>
    <path d="M86 302L170 245L260 300L350 245L434 302" fill="none" stroke="#f0e3ca" stroke-width="5"/>

    <!-- central shikhara -->
    <path d="M207 300V110L260 28L313 110V300Z" fill="url(#stone)"/>
    <path d="M232 122L260 65L288 122" fill="none" stroke="#f0dfbf" stroke-width="6"/>
    <circle cx="260" cy="18" r="12" fill="#c9a66a"/>
    <path d="M260 0v35" stroke="#8a6d48" stroke-width="5"/>
    <!-- side domes -->
    <path d="M98 302V192L151 145L204 192V302Z" fill="url(#stone)"/>
    <path d="M316 302V192L369 145L422 192V302Z" fill="url(#stone)"/>
    <circle cx="151" cy="139" r="8" fill="#c8a367"/>
    <circle cx="369" cy="139" r="8" fill="#c8a367"/>

    <!-- columns and arches -->
    <g fill="#eee2cf" stroke="#a28763" stroke-width="3">
      <rect x="56" y="325" width="34" height="195"/><rect x="112" y="325" width="34" height="195"/>
      <rect x="168" y="325" width="34" height="195"/><rect x="224" y="325" width="34" height="195"/>
      <rect x="280" y="325" width="34" height="195"/><rect x="336" y="325" width="34" height="195"/>
      <rect x="392" y="325" width="34" height="195"/>
    </g>
    <g fill="none" stroke="#9b825f" stroke-width="7">
      <path d="M73 390Q93 350 113 390M129 390Q149 350 169 390M185 390Q205 350 225 390M241 390Q261 350 281 390M297 390Q317 350 337 390M353 390Q373 350 393 390"/>
    </g>
    <path d="M36 523H460" stroke="#7d674c" stroke-width="12"/>
  </g>

  <!-- lawn -->
  <path d="M0 720C190 650 300 690 440 710C580 730 720 660 900 710V1400H0Z" fill="url(#lawn)"/>
  <path d="M0 890C240 830 370 875 510 900C650 925 765 860 900 885" fill="none" stroke="#d7ddc9" stroke-width="8" opacity=".28"/>

  <!-- luxury open-ground mandap -->
  <g transform="translate(235 780)">
    <ellipse cx="215" cy="250" rx="240" ry="55" fill="#5d6d5a" opacity=".18"/>
    <path d="M40 230V80L215 8L390 80V230Z" fill="#e7dbc4" opacity=".9"/>
    <path d="M18 88L215 0L412 88" fill="none" stroke="#c3a16a" stroke-width="10"/>
    <path d="M45 102L215 25L385 102" fill="none" stroke="#f6eddb" stroke-width="6"/>
    <g stroke="#a78658" stroke-width="8" fill="#f4ead6">
      <path d="M62 218V88L84 68L106 88V218Z"/><path d="M170 218V45L194 28L215 45V218Z"/><path d="M279 218V45L301 28L324 45V218Z"/><path d="M370 218V88L392 68L414 88V218Z"/>
    </g>
    <rect x="138" y="128" width="154" height="82" rx="8" fill="#c9ac78" opacity=".26"/>
    <path d="M215 28V218" stroke="#d6b77c" stroke-width="4"/>
    <g fill="#fff4dd">
      <circle cx="115" cy="92" r="8"/><circle cx="145" cy="77" r="8"/><circle cx="285" cy="77" r="8"/><circle cx="315" cy="92" r="8"/>
    </g>
  </g>

  <!-- aisle / chairs -->
  <path d="M390 1040L450 1040L610 1400H290Z" fill="#eee0cf" opacity=".75"/>
  <g fill="#efe4d4" stroke="#9f8767" stroke-width="3" opacity=".9">
    <path d="M70 1100h65l10 18H60zM775 1100h65l10 18h-85z"/>
    <path d="M120 1160h70l10 18h-90zM730 1160h70l10 18h-90z"/>
    <path d="M165 1220h70l10 18h-90zM685 1220h70l10 18h-90z"/>
  </g>

  <!-- warm lights -->
  <g fill="#f4d38e" opacity=".9">
    <circle cx="115" cy="760" r="7"/><circle cx="185" cy="730" r="6"/><circle cx="710" cy="735" r="6"/><circle cx="780" cy="760" r="7"/>
    <circle cx="87" cy="900" r="6"/><circle cx="813" cy="900" r="6"/><circle cx="150" cy="1010" r="5"/><circle cx="750" cy="1010" r="5"/>
  </g>

  <!-- foreground floral accents -->
  <g fill="#ece3d3" opacity=".92">
    <circle cx="94" cy="1250" r="24"/><circle cx="135" cy="1275" r="20"/><circle cx="805" cy="1250" r="24"/><circle cx="765" cy="1278" r="20"/>
  </g>
  <g stroke="#7c8d74" stroke-width="6" fill="none">
    <path d="M95 1380C98 1320 112 1285 130 1250M805 1380C802 1320 788 1285 770 1250"/>
  </g>
</svg>
